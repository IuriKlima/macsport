name: Security & Quality

on:
  push:
    branches: [ "main", "agent/security-hardening" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
      
    - name: Run linter
      run: npm run lint
      
    - name: Run Typecheck
      run: npx tsc --noEmit
      
    - name: NPM Audit
      run: npm audit
